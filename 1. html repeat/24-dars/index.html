<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* Barcha elementlar uchun margin/padding ziddiyatlarini bartaraf etish */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
    }

    .header {
      width: 100%;
      height: 40px;
      background-color: aquamarine;
      color: rgb(88, 5, 5);
      font-size: 20px;
      text-align: center;
      font-weight: 800;
      line-height: 40px;
    }

    .navbar {
      width: 100%;
      height: 60px;
      background-color: darkblue;
      font-size: 20px;
      text-align: center;
      font-weight: 800;
      color: aliceblue;
      line-height: 60px;
    }

    /* Asosiy va yon panelni yonma-yon joylashtirish uchun konteyner */
    .main-content {
      display: flex;
    }

    .section {
      background-color: rgb(192, 134, 9);
      height: 200px;
      width: 60%;
      font-size: 20px;
      text-align: center;
      font-weight: 800;
      line-height: 200px;
    }

    .aside {
      background-color: rgb(5, 99, 78);
      height: 200px;
      width: 40%;
      font-size: 20px;
      text-align: center;
      font-weight: 800;
      line-height: 200px;
    }

    .footer {
      width: 100%;
      height: 100px;
      background-color: burlywood;
      color: blue;
      font-size: 20px;
      text-align: center;
      font-weight: 800;
      line-height: 100px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">Header</header>
    <nav class="navbar">Navbar</nav>
    
    <div class="main-content">
      <main class="section">Section</main>
      <aside class="aside">Aside</aside>
    </div>

    <footer class="footer">Footer</footer>
  </div>

</body>
</html>
